<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340"><rect width="100%" height="100%" fill="#f7f8fa"/><text x="26" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#182237" font-weight="700" text-anchor="start">Recomendaciones para políticas públicas</text><text x="26" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#697586" font-weight="400" text-anchor="start">Prioridades derivadas de cobertura, brotes y certificaciones</text><rect x="20" y="78" width="1240" height="225" rx="14" fill="#fff" stroke="#dfe5ea"/><rect x="40" y="105" width="375" height="160" rx="12" fill="#fbfcfd" stroke="#dfe5ea"/><text x="56" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ad8127" font-weight="700" text-anchor="start">⚠️ Prioridad alta</text><text x="56" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">Cochliomyia hominivorax (Gusano barrenador) pres</text><text x="56" y="191" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">enta la mayor incidencia actual con solo 38% de </text><text x="56" y="210" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">cobertura. Queratoconjuntivitis y mastitis requieren a</text><rect x="440" y="105" width="375" height="160" rx="12" fill="#fbfcfd" stroke="#dfe5ea"/><text x="456" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ad8127" font-weight="700" text-anchor="start">📈 Oportunidad</text><text x="456" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">Incrementar certificación de Buenas Prácticas Pe</text><text x="456" y="191" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">cuarias. Inversión estimada: $4.2M MXN.</text><text x="456" y="210" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start"></text><rect x="840" y="105" width="375" height="160" rx="12" fill="#fbfcfd" stroke="#dfe5ea"/><text x="856" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a1244e" font-weight="700" text-anchor="start">🚨 Alertas</text><text x="856" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">18 brotes de gusano barrenador este mes. Reforza</text><text x="856" y="191" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">r bioseguridad: desinfección de calzado y cuaren</text><text x="856" y="210" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#697586" font-weight="600" text-anchor="start">tena de ganado nuevo.</text></svg>