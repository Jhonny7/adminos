<div class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-top">
    <div class="brand" (click)="openMenu($event)">
      <div class="brand-icon">
        <img src="assets/imgs/icon_bioparcela.png" alt="Bioparcela" class="brand-logo">
      </div>
      <div class="brand-copy" *ngIf="!collapsed">
        <h3>Bioparcela</h3>
        <p>Dashboard Agrícola</p>
      </div>
    </div>

    <div class="menu-list">
      <div *ngFor="let item of menu">
        <a
          class="menu-item"
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact !== false }"
          (click)="toggle(item)"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span *ngIf="!collapsed">{{ item.label }}</span>
          <mat-icon *ngIf="!collapsed && item.children?.length">{{ item.open ? 'expand_less' : 'expand_more' }}</mat-icon>
        </a>

        <div
          *ngIf="!collapsed && item.children?.length"
          class="submenu"
          [@submenuAnimation]="item.open ? 'open' : 'closed'"
        >
          <a
            *ngFor="let child of item.children"
            class="menu-item submenu-item"
            [routerLink]="child.routerLink"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: child.exact !== false }"
          >
            <mat-icon>{{ child.icon }}</mat-icon>
            <span>{{ child.label }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-badge">
      <div class="avatar">
        <mat-icon>person</mat-icon>
      </div>
      <div class="user-copy" *ngIf="!collapsed">
        <strong>Usuario Demo</strong>
        <span>Productor</span>
      </div>
    </div>
  </div>
</div>
