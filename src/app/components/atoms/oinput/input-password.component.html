<div [ngClass]="getContainerClass()">
  <p *ngIf="inputData.hasTopLabel" class="top-label">
    {{ inputData.label }}
  </p>

  <ng-container *ngIf="inputData.extraLeftComponent">
    <ng-container *ngComponentOutlet="inputData.extraLeftComponent"></ng-container>
  </ng-container>

  <div style="position: relative; width: 100%; display: flex; align-items: center;">
    <input
      [type]="showPassword ? 'text' : 'password'"
      [id]="inputData.id"
      class="arsa-input"
      [ngClass]="{ 'round-error': inputData.hasError }"
      [value]="inputData.value || ''"
      [placeholder]="inputData.placeholder"
      [attr.maxlength]="inputData.maxLength || 100"
      [name]="inputData.name"
      [disabled]="inputData.disabled || false"
      (input)="handleChange($event)"
      (blur)="handleBlur($event)"
      style="width: 100%; padding-right: 40px;"
    />

    <button
      type="button"
      *ngIf="inputData.hasEye"
      class="eye-toggle"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
    >
      <span *ngIf="showPassword">👁️</span>
      <span *ngIf="!showPassword">👁️‍🗨️</span>
    </button>
  </div>

  <ng-container *ngIf="inputData.extraComponent && !inputData.hasEye">
    <ng-container *ngComponentOutlet="inputData.extraComponent"></ng-container>
  </ng-container>
</div>

<p *ngIf="inputData.required && inputData.hasError" class="error">
  {{ inputData.errorMessage }}
</p>
