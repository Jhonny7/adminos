<ocontainer extraClass="animated fadeInDown clss" *ngIf="!load" [hasWaterMark]="false">
  <section class="container-login">

    <div class="posco-logo">
      <img src="assets/imgs/login/video-chat.png" alt="">
    </div>

    <!-- <div class="with-posco">
      <img src="assets/imgs/login/with-posco.png" alt="">
    </div> -->

    <div class="interpolate-img"></div>
    <div class="container-login-img"></div>
    <div class="white-screen"></div>

    <section class="form-box">
      <p class="title">Admin BioParcela</p>

      <div class="box">

        <div class="change-language">
          <img src="assets/imgs/login/mx.svg" alt="">
        </div>

        <p class="login-title">{{'login.login' | translate}}</p>

        <div class="field-group">
          <label class="field-label">{{'login.input-name' | translate}}</label>
          <input
            class="field-input"
            type="text"
            [placeholder]="'login.input-name' | translate"
            [(ngModel)]="dataLogin.access"
          />
        </div>

        <div class="field-group">
          <label class="field-label">{{'login.input-password' | translate}}</label>
          <div class="inp-pass">
            <input
              class="field-input password-input"
              [type]="type ? 'password' : 'text'"
              [placeholder]="'login.input-password' | translate"
              [(ngModel)]="dataLogin.password"
            />
            <button type="button" class="eye" (click)="eye()" aria-label="Mostrar u ocultar contraseña">
              <span class="material-icons outlined">{{ type ? 'visibility' : 'visibility_off' }}</span>
            </button>
          </div>
        </div>

        <obutton extraClass="posco-login-btn" (click)="login()">{{'login.login' | translate}}</obutton>

        <p class="forgot" (click)="forgot()">
          <span class="material-icons outlined">lock_open</span>
          {{'login.forgot' | translate}}
        </p>
      </div>
    </section>
  </section>
</ocontainer>
